[tool.poetry]
name = "lectureai"
version = "0.1.0"
description = "LectureAI backend"
authors = ["dsergeev"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.13"
asyncpg = "^0.29"
psycopg2-binary = "^2.9"
pydantic = "^2.7"
pydantic-settings = "^2.3"
argon2-cffi = "^23.1"
python-jose = {extras = ["cryptography"], version = "^3.3"}
redis = "^5.0"
minio = "^7.2"
anthropic = "^0.30"
tenacity = "^8.3"
celery = {extras = ["redis"], version = "^5.4"}
pdfminer-six = "^20221105"
python-docx = "^1.1"
python-pptx = "^1.0"
python-multipart = "^0.0.9"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
ruff = "^0.5"
mypy = "^1.10"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
