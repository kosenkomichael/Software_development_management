name: Deploy

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Git ref приложения (ветка/тег/коммит)"
        required: true
        default: "main"
        type: string
      image_tag:
        description: "Тег образа (SHA коммита из build-push)"
        required: true
        default: "latest"
        type: string
      compose_profiles:
        description: "Профили compose (через запятую), напр. monitoring"
        required: false
        default: "monitoring,mail"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-start:
    uses: ./.github/workflows/telegram-notify.yml
    with:
      template: deploy-start.txt
      workflow_name: Deploy
      app_ref: ${{ inputs.app_ref }}
      image_tag: ${{ inputs.image_tag }}
      compose_profiles: ${{ inputs.compose_profiles }}
      environment_name: sbshinobi
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sbshinobi

    steps:
      - name: Checkout pipelines
        uses: actions/checkout@v4

      - name: WireGuard up
        env:
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_PEER_PUBLIC: ${{ secrets.WG_PEER_PUBLIC }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
          WG_ALLOWED_IPS: ${{ secrets.WG_ALLOWED_IPS }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
        run: bash scripts/wireguard-up.sh

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPENSSH_PRIVATE_KEY }}

      - name: Install Ansible
        run: |
          pip install 'ansible-core>=2.16,<2.18' 'ansible>=9,<10'
          ansible-galaxy collection install community.docker ansible.posix

      - name: Deploy (Ansible)
        working-directory: ansible
        env:
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=accept-new"
          APP_ENV: ${{ secrets.APP_ENV }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ansible-playbook -i inventory.yml deploy.yml \
            -e "app_ref=${{ inputs.app_ref }}" \
            -e "image_tag=${{ inputs.image_tag }}" \
            -e "compose_profiles=${{ inputs.compose_profiles }}"

  notify-completion:
    needs:
      - deploy

    if: always()

    uses: ./.github/workflows/telegram-notify.yml

    with:
      template: >-
        ${{ needs.deploy.result == 'success' && 'deploy-success.txt' ||
            needs.deploy.result == 'cancelled' && 'deploy-cancelled.txt' ||
            'deploy-failure.txt' }}

      workflow_name: Deploy
      app_ref: ${{ inputs.app_ref }}
      image_tag: ${{ inputs.image_tag }}
      compose_profiles: ${{ inputs.compose_profiles }}
      environment_name: sbshinobi

    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}