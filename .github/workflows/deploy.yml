name: Deploy

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Git ref приложения (ветка/тег/коммит)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sbshinobi

    steps:
      - name: Checkout pipelines
        uses: actions/checkout@v4

      - name: WireGuard up
        env:
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_PEER_PUBLIC: ${{ secrets.WG_PEER_PUBLIC }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
          WG_ALLOWED_IPS: ${{ secrets.WG_ALLOWED_IPS }}
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
        run: bash scripts/wireguard-up.sh

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OPENSSH_PRIVATE_KEY }}

      - name: Install Ansible
        run: |
          pip install 'ansible-core>=2.16,<2.18' 'ansible>=9,<10'
          ansible-galaxy collection install community.docker ansible.posix

      - name: Deploy (Ansible)
        working-directory: ansible
        env:
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=accept-new"
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          ansible-playbook -i inventory.yml deploy.yml -e "app_ref=${{ inputs.app_ref }}"
