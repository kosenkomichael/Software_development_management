name: Build and Push

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Git ref приложения (ветка/тег/коммит)"
        required: true
        default: "main"
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  notify-start:
    uses: ./.github/workflows/telegram-notify.yml
    with:
      template: build-start.txt
      workflow_name: build-push
      app_ref: ${{ inputs.app_ref }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set short SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "app_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      app_sha: ${{ steps.vars.outputs.app_sha }}

  notify-completion:
    needs:
      - build-and-push

    if: always()

    uses: ./.github/workflows/telegram-notify.yml

    with:
      template: >-
        ${{ needs.build-and-push.result == 'success' && 'build-success.txt' ||
            needs.build-and-push.result == 'cancelled' && 'build-cancelled.txt' ||
            'build-failure.txt' }}

      workflow_name: Build and Push
      app_ref: ${{ inputs.app_ref }}
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      app_sha: ${{ needs.build-and-push.outputs.app_sha }}

    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}